<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SickleScan Lab</title>
  <meta name="description" content="Sickle cell blood smear analysis workspace for labs: multi-field slides, patient tracking, printable reports. Runs in your browser; data stays on your device.">
  <meta name="theme-color" content="#8f1d33">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="shell">
    <nav class="sidebar no-print" aria-label="Main">
      <a class="brand" href="#/">
        <img src="favicon.svg" alt="" width="30" height="30">
        <span><strong>SickleScan</strong><small>Lab workspace</small></span>
      </a>
      <a class="btn btn-primary new-btn" href="#/slides/new">+ New analysis</a>
      <ul class="nav">
        <li><a href="#/" data-nav="dashboard"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 3h6v8H3zM11 3h6v5h-6zM11 10h6v7h-6zM3 13h6v4H3z"/></svg>Dashboard</a></li>
        <li><a href="#/patients" data-nav="patients"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="6.5" r="3.5"/><path d="M3 18c0-4 3.2-6.5 7-6.5s7 2.5 7 6.5z"/></svg>Patients</a></li>
        <li><a href="#/slides" data-nav="slides"><svg viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="6" width="16" height="8" rx="1.5"/><circle cx="7" cy="10" r="2" fill="#fff"/></svg>Slides</a></li>
        <li><a href="#/settings" data-nav="settings"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8.6 2h2.8l.4 2.3 1.6.9 2.2-.8 1.4 2.4-1.8 1.5v1.4l1.8 1.5-1.4 2.4-2.2-.8-1.6.9-.4 2.3H8.6l-.4-2.3-1.6-.9-2.2.8-1.4-2.4 1.8-1.5V8.3L3 6.8l1.4-2.4 2.2.8 1.6-.9z"/><circle cx="10" cy="10" r="2.4" fill="#fff"/></svg>Settings</a></li>
        <li><a href="#/guide" data-nav="guide"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 3h9l3 3v11H4z"/><path d="M7 9h6M7 12h6M7 15h4" stroke="#fff" stroke-width="1.4"/></svg>Guide</a></li>
      </ul>
      <div class="side-foot">
        <p><span class="dot"></span>Data stays on this device</p>
        <p>Research &amp; education use only. Not a diagnosis.</p>
      </div>
    </nav>
    <main id="app" class="main" tabindex="-1">
      <div class="loading">Loading…</div>
    </main>
  </div>
  <noscript><p class="noscript">SickleScan needs JavaScript enabled.</p></noscript>
</body>
</html>
